name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      
      - name: Install dependencies
        working-directory: ./src
        run: npm ci
      
      - name: Bundle project
        working-directory: ./src
        run: npm run bundle
      
      - name: Create release zip
        run: |
          mkdir -p release/camunda-modeler-annotations-plugin
          cp src/index.js release/camunda-modeler-annotations-plugin/
          cp src/annotations-plugin.js release/camunda-modeler-annotations-plugin/
          cd release
          zip -r ../camunda-modeler-annotations-plugin-${{ github.ref_name }}.zip camunda-modeler-annotations-plugin
          cd ..
      
      - name: Verify zip contents
        run: unzip -l camunda-modeler-annotations-plugin-${{ github.ref_name }}.zip
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: camunda-modeler-annotations-plugin-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}